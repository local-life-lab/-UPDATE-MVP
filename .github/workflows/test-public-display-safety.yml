name: Public display safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "new.html"
      - "closed.html"
      - "scripts/tests/test_public_display_safety.py"
      - "scripts/tests/test_legacy_placeholder_indexing.py"
      - "jobs.html"
      - "store-drug-cosmos-yamaguchi-ogori.html"
      - "store-trial-yamaguchi-ogori.html"
      - ".github/workflows/test-public-display-safety.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "new.html"
      - "closed.html"
      - "scripts/tests/test_public_display_safety.py"
      - "scripts/tests/test_legacy_placeholder_indexing.py"
      - "jobs.html"
      - "store-drug-cosmos-yamaguchi-ogori.html"
      - "store-trial-yamaguchi-ogori.html"
      - ".github/workflows/test-public-display-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-display-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run public display safety tests
        run: python -m unittest discover -s scripts/tests -p 'test_public_display_safety.py' -v
      - name: Run legacy placeholder indexing tests
        run: python -m unittest discover -s scripts/tests -p 'test_legacy_placeholder_indexing.py' -v
